<p>Opportunities you have bookmarked.</p>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="applicant-dashboard.js"></script>
<script src="student.js"></script>
<script>

(function () {
  var S = window.placewickStudent;
  function empty(icon, h, p, a) { return '<div class="empty-state"><i class="fa-regular ' + icon + '"></i><h4>' + h + '</h4><p>' + p + '</p>' + (a || '') + '</div>'; }
  var opps = [], ids = [], grid = document.getElementById("saved-grid"), count = document.getElementById("saved-result-count");
  function render() {
    var list = opps.filter(function (o) { return ids.indexOf(o.id) !== -1; });
    grid.innerHTML = list.length ? list.map(function (o) { return S.card(o, true, false); }).join("")
      : empty("fa-bookmark", "Nothing saved yet", "Tap the bookmark on any opportunity to keep it here.", '<a href="browse-opportunities.html" class="btn btn-primary btn-sm">Browse opportunities</a>');
    count.textContent = list.length + " saved opportunit" + (list.length === 1 ? "y" : "ies");
  }
  S.init().then(function () { S.badges(); return Promise.all([S.loadOpps(), S.loadSavedIds()]); }).then(function (r) { opps = r[0]; ids = r[1]; render(); }).catch(function () { S.fail(); });
  grid.addEventListener("click", function (e) {
    var op = e.target.closest("[data-open]");
    if (op) { e.preventDefault(); location.href = "browse-opportunities.html?open=" + op.dataset.open; return; }
    var sv = e.target.closest("[data-save]");
    if (sv) {
      var id = sv.dataset.save;
      S.toggleSave(id, false).then(function (r) {
        if (r.error) { S.toast("Could not update your saved list."); return; }
        ids = ids.filter(function (x) { return x !== id; }); render(); S.toast("Removed from saved");
      });
    }
  });
})();
</script>
</body>
