<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Applicant Onboarding | Placewick</title>

    <meta
        name="description"
        content="Tell Placewick about your internship and career preferences."
    >

    <!-- Google Font: Manrope -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="applicant-onboarding.css"
    >

</head>


<body>


<main class="applicant-onboarding">

    <div class="applicant-onboarding-container">


        <!-- ================================
             LOGO
        ================================= -->

        <section class="applicant-onboarding-top">

            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>


        <!-- ================================
             ONBOARDING PROGRESS
        ================================= -->

        <section class="onboarding-flow">

            <!-- Stage 1 — Account Type -->

            <div
                class="circle active"
                title="Account type"
            ></div>

            <div class="line"></div>


            <!-- Stage 2 — About You -->

            <div
                class="circle active"
                title="About you"
            ></div>

            <div class="line"></div>


            <!-- Stage 3 — Education -->

            <div
                class="circle active"
                title="Education"
            ></div>

            <div class="line"></div>


            <!-- Stage 4 — Opportunities -->

            <div
                class="circle active"
                title="Opportunities"
            ></div>

            <div class="line"></div>


            <!-- Stage 5 — Skills -->

            <div
                class="circle active"
                title="Skills"
            ></div>

            <div class="line"></div>


            <!-- Stage 6 — Preferences -->

            <div
                class="circle active"
                title="Preferences"
            ></div>

            <div class="line"></div>


            <!-- Stage 7 — Complete -->

            <div
                class="circle"
                title="Complete"
            ></div>

        </section>


        <!-- ================================
             HEADER
        ================================= -->

        <section class="applicant-onboarding-header">

            <h1>
                What are your preferences?
            </h1>

            <p>
                Tell us where and how you'd like to find opportunities.
            </p>

        </section>


        <!-- ================================
             FORM
        ================================= -->

        <form
            class="onboarding-form"
            action="account-completed.html"
        >


            <!-- Preferred State -->

            <div class="form-group">

                <label for="state">
                    Where would you like to work?
                </label>

                <select
                    id="state"
                    name="state"
                    required
                >

                    <option
                        value=""
                        disabled
                        selected
                    >
                        Select a preferred state
                    </option>


                    <option value="abia">
                        Abia
                    </option>

                    <option value="adamawa">
                        Adamawa
                    </option>

                    <option value="akwa-ibom">
                        Akwa Ibom
                    </option>

                    <option value="anambra">
                        Anambra
                    </option>

                    <option value="bauchi">
                        Bauchi
                    </option>

                    <option value="bayelsa">
                        Bayelsa
                    </option>

                    <option value="benue">
                        Benue
                    </option>

                    <option value="borno">
                        Borno
                    </option>

                    <option value="cross-river">
                        Cross River
                    </option>

                    <option value="delta">
                        Delta
                    </option>

                    <option value="ebonyi">
                        Ebonyi
                    </option>

                    <option value="edo">
                        Edo
                    </option>

                    <option value="ekiti">
                        Ekiti
                    </option>

                    <option value="enugu">
                        Enugu
                    </option>

                    <option value="gombe">
                        Gombe
                    </option>

                    <option value="imo">
                        Imo
                    </option>

                    <option value="jigawa">
                        Jigawa
                    </option>

                    <option value="kaduna">
                        Kaduna
                    </option>

                    <option value="kano">
                        Kano
                    </option>

                    <option value="katsina">
                        Katsina
                    </option>

                    <option value="kebbi">
                        Kebbi
                    </option>

                    <option value="kogi">
                        Kogi
                    </option>

                    <option value="kwara">
                        Kwara
                    </option>

                    <option value="lagos">
                        Lagos
                    </option>

                    <option value="nasarawa">
                        Nasarawa
                    </option>

                    <option value="niger">
                        Niger
                    </option>

                    <option value="ogun">
                        Ogun
                    </option>

                    <option value="ondo">
                        Ondo
                    </option>

                    <option value="osun">
                        Osun
                    </option>

                    <option value="oyo">
                        Oyo
                    </option>

                    <option value="plateau">
                        Plateau
                    </option>

                    <option value="rivers">
                        Rivers
                    </option>

                    <option value="sokoto">
                        Sokoto
                    </option>

                    <option value="taraba">
                        Taraba
                    </option>

                    <option value="yobe">
                        Yobe
                    </option>

                    <option value="zamfara">
                        Zamfara
                    </option>

                    <option value="fct">
                        Federal Capital Territory (FCT)
                    </option>

                </select>

            </div>


            <!-- Work Arrangement -->

            <div class="form-group">

                <label for="work-type">
                    What type of work arrangement do you prefer?
                </label>

                <select
                    id="work-type"
                    name="work-type"
                    required
                >

                    <option
                        value=""
                        disabled
                        selected
                    >
                        Select a work arrangement
                    </option>

                    <option value="onsite">
                        On-site
                    </option>

                    <option value="remote">
                        Remote
                    </option>

                    <option value="hybrid">
                        Hybrid
                    </option>

                    <option value="flexible">
                        I'm open to any
                    </option>

                </select>

            </div>


            <!-- Relocation -->

            <div class="form-group">

                <label for="relocation">
                    Are you open to relocating?
                </label>

                <select
                    id="relocation"
                    name="relocation"
                    required
                >

                    <option
                        value=""
                        disabled
                        selected
                    >
                        Select an option
                    </option>

                    <option value="yes">
                        Yes
                    </option>

                    <option value="no">
                        No
                    </option>

                    <option value="maybe">
                        Maybe, depending on the opportunity
                    </option>

                </select>

            </div>


            <!-- Navigation -->

            <div class="onboarding-buttons">

                <a
                    href="undergraduate-skills.html"
                    class="back-button"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>


                <a
                href="undergraduate-profile-complete.html"
                class="continue-button"
            >

                Continue

                <i class="fa-solid fa-arrow-right"></i>

            </a>

            </div>


        </form>


    </div>

</main>


</body>

</html>
