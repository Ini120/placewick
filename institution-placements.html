<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placements | Placewick Institution</title>

    <meta name="description" content="Placewick institution dashboard: track SIWES placements, logbooks, supervisors and accreditation reports.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="institution-dashboard.css">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-v2/favicon-32x32-v2.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-v2/favicon-16x16-v2.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-v2/apple-touch-icon-v2.png?v=2">
    <link rel="icon" type="image/x-icon" href="favicon-v2/favicon-v2.ico?v=2">
    <link rel="stylesheet" href="dash-extra.css">
    <link rel="stylesheet" href="student-extra.css">
</head>


<body>

<div class="dashboard-shell">

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">

        <a href="index.html" class="sidebar-logo">
            <img src="images/placewick-LOGO.png" alt="Placewick">
        </a>

        <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Close menu">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <nav class="sidebar-nav">
<a href="institution-dashboard.html" class="sidebar-link"><i class="fa-solid fa-grid-2"></i> Dashboard </a>
<a href="institution-placements.html" class="sidebar-link active"><i class="fa-solid fa-user-check"></i> Placements </a>
<a href="institution-logbooks.html" class="sidebar-link"><i class="fa-solid fa-book-open"></i> Logbooks <span class="badge" data-badge="review" hidden></span></a>
<a href="institution-supervisors.html" class="sidebar-link"><i class="fa-solid fa-person-walking-luggage"></i> Supervisors </a>
<a href="institution-reports.html" class="sidebar-link"><i class="fa-solid fa-chart-column"></i> Reports </a>
<span class="sidebar-section-label">Account</span>
<span class="sidebar-link is-soon"><i class="fa-solid fa-building-columns"></i> Institution Profile <span class="soon-tag">Soon</span></span>
<span class="sidebar-link is-soon"><i class="fa-solid fa-gear"></i> Settings <span class="soon-tag">Soon</span></span>
</nav>

        <div class="sidebar-footer">

            <div class="sidebar-user">
                <div class="sidebar-avatar"></div>
                <div class="sidebar-user-info">
                    <h4>Your institution</h4>
                    <span></span>
                </div>
            </div>

            <a href="index.html" class="sidebar-logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                Log out
            </a>

        </div>

    </aside>

    <div class="dashboard-main">

        <header class="dashboard-header">

            <div class="dashboard-header-left">

                <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open menu">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div>
                    <h1>Placements</h1>
<p>Every student at your institution and where they stand.</p>
                </div>

            </div>

            <div class="dashboard-header-right">

                

                <a href="institution-dashboard.html" class="header-avatar"></a>

            </div>

        </header>

        <main class="dashboard-content">
<div class="page-error" id="page-error" hidden></div>
<div class="verify-note" id="verify-note" hidden></div>

<section class="stats-row">
  <div class="stat-card"><div class="stat-icon success"><i class="fa-solid fa-circle-check"></i></div><div><div class="stat-value" id="s-placed">0</div><div class="stat-label">Placed</div></div></div>
  <div class="stat-card"><div class="stat-icon purple"><i class="fa-solid fa-comments"></i></div><div><div class="stat-value" id="s-interview">0</div><div class="stat-label">Interviewing</div></div></div>
  <div class="stat-card"><div class="stat-icon info"><i class="fa-solid fa-paper-plane"></i></div><div><div class="stat-value" id="s-applied">0</div><div class="stat-label">Applied</div></div></div>
  <div class="stat-card"><div class="stat-icon warning"><i class="fa-solid fa-user-clock"></i></div><div><div class="stat-value" id="s-none">0</div><div class="stat-label">Not Started</div></div></div>
</section>
<div class="page-toolbar">
  <div class="search-field"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="placement-search" placeholder="Search name, matric no. or company"></div>
  <div class="chip-group" id="placement-filters">
    <button type="button" class="chip is-active" data-filter="all">All</button>
    <button type="button" class="chip" data-filter="placed">Placed</button>
    <button type="button" class="chip" data-filter="interview">Interviewing</button>
    <button type="button" class="chip" data-filter="applied">Applied</button>
    <button type="button" class="chip" data-filter="none">Not started</button>
  </div>
  <button type="button" class="btn btn-outline spacer" id="export"><i class="fa-solid fa-download"></i> Export CSV</button>
</div>
<div class="panel">
  <div class="table-wrap">
    <table class="data-table" id="placement-table" style="min-width:720px">
      <thead><tr><th>Student</th><th>Department</th><th>Status</th><th>Company</th><th>Location</th><th>Latest</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="placement-empty"></div>
</div>
</main>

    </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="applicant-dashboard.js"></script>
<script src="institution.js"></script>
<script>
(function () {
  var I = window.placewickInst, esc = I.esc;
  function g(id) { return document.getElementById(id); }
  function set(id, v) { var e = g(id); if (e) { e.textContent = v; } }
  function badges(d) {
    document.querySelectorAll('[data-badge="review"]').forEach(function (e) { e.textContent = d.toReview.length; e.hidden = !d.toReview.length; });
  }
  function boot(render) {
    I.init().then(function () { return I.load(); }).then(function (d) { badges(d); render(d); }).catch(function (e) { console.error(e); I.fail(); });
  }

  var rowsData = [], filter = "all", q = "";
  function build(d) {
    return d.students.map(function (s) {
      var st = d.state[s.id], p = d.placementByStudent[s.id], mine = d.appsByStudent[s.id] || [], a = mine[0];
      var o = a && d.opps[a.opportunity_id];
      var co = p ? I.company(d, p) : (o && d.companies[o.company_id] ? d.companies[o.company_id].name : "");
      var loc = p ? I.companyLoc(d, p) : (o ? o.location || "" : "");
      var latest = p ? "Placed " + I.ago(p.created_at) : a ? "Applied " + I.ago(a.created_at) : "No applications";
      return { id: s.id, name: I.name(d, s.id), matric: s.matric_no || "", dept: s.department || s.course || "", level: s.level || "", st: st, co: co || "", loc: loc, latest: latest,
               supervisor: p && d.supMap[p.academic_supervisor_id] ? d.supMap[p.academic_supervisor_id].name : "", start: p ? p.start_date : "", end: p ? p.end_date : "" };
    });
  }
  function draw() {
    var list = rowsData.filter(function (r) {
      return (filter === "all" || r.st === filter) && (!q || [r.name, r.matric, r.co, r.dept].join(" ").toLowerCase().indexOf(q) !== -1);
    });
    g("tbody").innerHTML = list.map(function (r) {
      return '<tr><td><div class="person-cell"><div class="avatar-sm">' + esc(I.initials(r.name)) + '</div><div><h4>' + esc(r.name) + '</h4><span>' + esc(r.matric) + '</span></div></div></td><td>' + esc(r.dept) + '</td><td>' + I.stateBadge(r.st) + '</td><td>' + esc(r.co) + '</td><td class="cell-muted">' + esc(r.loc) + '</td><td class="cell-muted">' + esc(r.latest) + '</td></tr>';
    }).join("");
    g("placement-table").hidden = !list.length;
    g("placement-empty").innerHTML = list.length ? "" : (rowsData.length ? I.empty("fa-magnifying-glass", "No matching students", "Try a different search or filter.") : I.noStudents());
  }
  boot(function (d) {
    set("s-placed", d.count.placed); set("s-interview", d.count.interview); set("s-applied", d.count.applied); set("s-none", d.count.none);
    rowsData = build(d); draw();
    g("placement-search").addEventListener("input", function () { q = this.value.trim().toLowerCase(); draw(); });
    g("placement-filters").addEventListener("click", function (e) {
      var b = e.target.closest(".chip"); if (!b) { return; }
      document.querySelectorAll("#placement-filters .chip").forEach(function (c) { c.classList.remove("is-active"); });
      b.classList.add("is-active"); filter = b.dataset.filter; draw();
    });
    g("export").addEventListener("click", function () {
      if (!rowsData.length) { I.toast("Nothing to export yet"); return; }
      var label = { placed: "Placed", interview: "Interviewing", applied: "Applied", none: "Not started" };
      I.csv("placewick-placements.csv", ["Student", "Matric no", "Department", "Level", "Status", "Company", "Location", "Academic supervisor", "Start date", "End date"],
        rowsData.map(function (r) { return [r.name, r.matric, r.dept, r.level, label[r.st], r.co, r.loc, r.supervisor, r.start, r.end]; }));
    });
  });
})();
</script>

</body>

</html>
