<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
<script>
(function () {
  var M = window.placewickAdmin, esc = M.esc;
  function g(id) { return document.getElementById(id); }
  function set(id, v) { var e = g(id); if (e) { e.textContent = v; } }
  function cnt(table, col, val) {
    var q = M.sb.from(table).select("id", { count: "exact", head: true });
    if (col) { q = q.eq(col, val); }
    return q.then(function (r) { return r.count || 0; });
  }

  var rows = [], q = "";
  function draw() {
    var list = rows.filter(function (r) { return !q || [r.name, r.email, r.school, r.course].join(" ").toLowerCase().indexOf(q) !== -1; });
    set("count", rows.length + (rows.length === 1 ? " student" : " students"));
    g("list").innerHTML = list.length ? list.slice(0, 200).map(function (r) {
      return '<div class="verify-row"><div class="verify-logo">' + esc(M.initials(r.name)) + '</div><div class="verify-details"><div class="verify-details-top"><h4>' + esc(r.name) + '</h4>' + (r.linked ? '<span class="verify-type-badge st-verified">Linked</span>' : '') + '</div><span>' + esc([r.school, r.course, r.email].filter(Boolean).join(" · ")) + ' &middot; joined ' + M.ago(r.created_at) + '</span></div></div>';
    }).join("") : M.empty("fa-user-graduate", "No students found", "Students appear here after they sign up.");
  }
  M.init().then(function () {
    M.badges();
    return Promise.all([M.sb.from("students").select("id,course,institution_id,institution_name_other,created_at").order("created_at", { ascending: false }), M.sb.from("profiles").select("id,full_name,email").eq("role", "student")]);
  }).then(function (r) {
    var names = {}; (r[1].data || []).forEach(function (p) { names[p.id] = p; });
    rows = (r[0].data || []).map(function (s) { var p = names[s.id] || {}; return { name: p.full_name || p.email || "Student", email: p.email, school: s.institution_name_other, course: s.course, linked: !!s.institution_id, created_at: s.created_at }; });
    draw();
  }).catch(function (e) { console.error(e); M.fail(); });
  g("search").addEventListener("input", function () { q = this.value.trim().toLowerCase(); draw(); });
})();
</script>
