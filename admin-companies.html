<div class="page-error" id="page-error" hidden></div>

<div class="panel">
  <div class="panel-header"><h3>All Companies</h3></div>
  <div class="panel-filters" id="filters">
    <button type="button" class="panel-filter is-active" data-filter="pending">Pending</button>
    <button type="button" class="panel-filter" data-filter="verified">Verified</button>

    </div>


</div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
<script>
(function () {
  var M = window.placewickAdmin, esc = M.esc;
  function g(id) { return document.getElementById(id); }
  function set(id, v) { var e = g(id); if (e) { e.textContent = v; } }
  function cnt(table, col, val) {
    var q = M.sb.from(table).select("id", { count: "exact", head: true });
    if (col) { q = q.eq(col, val); }
    return q.then(function (r) { return r.count || 0; });
  }

  var KIND = "company", TABLE = "companies", filter = "pending", q = "", rows = [], emails = {};
  function line(r) {
    return [r.industry, r.location].filter(Boolean).join(' · ');
  }
  function actions(r) {
    var h = '<button type="button" class="vbtn view" data-view="' + r.id + '">View</button>';
    if (r.status !== "verified") { h += '<button type="button" class="vbtn approve" data-set="verified" data-id="' + r.id + '">Verify</button>'; }
    if (r.status === "pending") { h += '<button type="button" class="vbtn reject" data-set="rejected" data-id="' + r.id + '">Reject</button>'; }
    if (r.status === "verified") { h += '<button type="button" class="vbtn reject" data-set="pending" data-id="' + r.id + '">Revoke</button>'; }
    return h;
  }
  function draw() {
    ["all", "pending", "verified", "rejected"].forEach(function (k) {
      var n = rows.filter(function (r) { return k === "all" || r.status === k; }).length;
      var b = document.querySelector('[data-filter="' + k + '"]'); if (b) { b.textContent = k[0].toUpperCase() + k.slice(1) + " (" + n + ")"; }
    });
    var list = rows.filter(function (r) {
      return (filter === "all" || r.status === filter) && (!q || [r.name, line(r), emails[r.owner_id] || ""].join(" ").toLowerCase().indexOf(q) !== -1);
    });
    g("list").innerHTML = list.length ? list.map(function (r) {
      return '<div class="verify-row"><div class="verify-logo">' + esc(M.initials(r.name)) + '</div><div class="verify-details"><div class="verify-details-top"><h4>' + esc(r.name) + '</h4>' + M.statusBadge(r.status) + '</div><span>' + esc(line(r)) + ' &middot; ' + esc(emails[r.owner_id] || "") + ' &middot; ' + M.ago(r.created_at) + '</span></div><div class="verify-actions">' + actions(r) + '</div></div>';
    }).join("") : M.empty("fa-circle-check", filter === "pending" ? "Nothing waiting" : "Nothing here", filter === "pending" ? "No companys are waiting for verification." : "No companys match this view.");
  }
  function view(r) {
    var facts = [['Industry', r.industry], ['Location', r.location], ['RC number', r.rc_number], ['Official email', r.official_email], ['Website', r.website], ['Account email', emails[r.owner_id]]];
    var html = '<button type="button" class="modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><h2>' + esc(r.name) + '</h2><ul class="facts"><li><span>Status</span><span>' + esc(r.status) + '</span></li>' +
      facts.map(function (f) { return '<li><span>' + f[0] + '</span><span>' + esc(f[1] || "Not provided") + '</span></li>'; }).join("") + '<li><span>Registered</span><span>' + new Date(r.created_at).toLocaleDateString("en-GB") + '</span></li></ul>' +
      (r.description ? '<p style="margin:14px 0 0;font-size:14px;line-height:1.6;color:#344054">' + esc(r.description) + '</p>' : '');
    var ov = document.createElement("div"); ov.className = "modal-overlay"; ov.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(ov);
    ov.addEventListener("click", function (e) { if (e.target === ov || e.target.closest(".modal-close")) { ov.remove(); } });
  }
  M.init().then(function () {
    M.badges();
    return M.sb.from(TABLE).select("*").order("created_at", { ascending: false });
  }).then(function (r) {
    if (r.error) { throw r.error; }
    rows = r.data || [];
    var ids = rows.map(function (x) { return x.owner_id; });
    return (ids.length ? M.sb.from("profiles").select("id,email").in("id", ids) : Promise.resolve({ data: [] })).then(function (p) {
      (p.data || []).forEach(function (x) { emails[x.id] = x.email; });
      draw();
    });
  }).catch(function (e) { console.error(e); M.fail(); });
  g("filters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-filter]"); if (!b) { return; }
    document.querySelectorAll("#filters .panel-filter").forEach(function (x) { x.classList.remove("is-active"); });
    b.classList.add("is-active"); filter = b.dataset.filter; draw();
  });
  g("search").addEventListener("input", function () { q = this.value.trim().toLowerCase(); draw(); });
  g("list").addEventListener("click", function (e) {
    var v = e.target.closest("[data-view]");
    if (v) { var r = rows.filter(function (x) { return x.id === v.dataset.view; })[0]; if (r) { view(r); } return; }
    var b = e.target.closest("[data-set]"); if (!b) { return; }
    var r2 = rows.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!r2) { return; }
    var to = b.dataset.set;
    if (to !== "verified" && !confirm((to === "rejected" ? "Reject " : "Revoke verification for ") + r2.name + "?")) { return; }
    b.disabled = true;
    M.setStatus(KIND, r2.id, to).then(function (res) {
      if (res.error) { b.disabled = false; M.toast("Could not update. Please try again."); return; }
      r2.status = to; draw(); M.badges();
      M.toast(to === "verified" ? r2.name + " verified" : to === "rejected" ? r2.name + " rejected" : "Verification revoked");
    });
  });
})();
</script>

</body>
