<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Education | Placewick</title>

    <meta
        name="description"
        content="Tell Placewick about your academic background."
    >

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="applicant-onboarding.css"
    >

</head>


<body>

<main class="applicant-onboarding">

    <div class="applicant-onboarding-container">


        <!-- Stage -->

        <div class="onboarding-stage">
            Stage 3 of 7
        </div>


        <!-- Logo -->

        <section class="applicant-onboarding-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>


        <!-- Progress -->

       <section class="onboarding-flow">

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Journey</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>About You</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Education</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>Opportunities</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>Skills</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>Preferences</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>All Set</span>
    </div>

</section>

        <!-- Header -->

        <section class="onboarding-header">

            <h1>Your education</h1>

            <p>
                This helps companies understand your academic
                background and match you to the right roles.
            </p>

        </section>


        <!-- Form -->

        <form class="onboarding-form">


            <!-- Institution -->

            <div class="form-group">

                <label for="institution">
                    Institution attended
                </label>

                <select
                    id="institution"
                    name="institution"
                    required
                >

                    <option value="" disabled selected>
                        Select your institution
                    </option>

                    <option value="unilag">University of Lagos</option>
                    <option value="ui">University of Ibadan</option>
                    <option value="oau">Obafemi Awolowo University</option>
                    <option value="unn">University of Nigeria, Nsukka</option>
                    <option value="abu">Ahmadu Bello University</option>
                    <option value="covenant">Covenant University</option>
                    <option value="uniben">University of Benin</option>
                    <option value="futa">Federal University of Technology, Akure</option>
                    <option value="lasu">Lagos State University</option>
                    <option value="unilorin">University of Ilorin</option>
                    <option value="other">Other / not listed</option>

                </select>

            </div>


            <!-- Degree / Qualification -->

            <div class="form-group">

                <label for="degree">
                    Highest qualification
                </label>

                <select
                    id="degree"
                    name="degree"
                    required
                >

                    <option value="" disabled selected>
                        Select your qualification
                    </option>

                    <option value="ond">OND</option>
                    <option value="hnd">HND</option>
                    <option value="bsc">B.Sc.</option>
                    <option value="ba">B.A.</option>
                    <option value="beng">B.Eng.</option>
                    <option value="msc">M.Sc.</option>
                    <option value="mba">MBA</option>
                    <option value="phd">Ph.D.</option>
                    <option value="other">Other</option>

                </select>

            </div>


            <!-- Course / Field of Study -->

            <div class="form-group">

                <label for="course">
                    Course of study
                </label>

                <input
                    type="text"
                    id="course"
                    name="course"
                    placeholder="e.g. Computer Science"
                    required
                >

            </div>


            <!-- Class of Degree + Year of Graduation -->

            <div class="entry-graduation">

                <div class="form-group">

                    <label for="class-of-degree">
                        Class of degree
                    </label>

                    <select
                        id="class-of-degree"
                        name="class-of-degree"
                    >

                        <option value="" disabled selected>
                            Select class
                        </option>

                        <option value="first-class">First Class</option>
                        <option value="second-upper">Second Class Upper</option>
                        <option value="second-lower">Second Class Lower</option>
                        <option value="third-class">Third Class</option>
                        <option value="pass">Pass</option>
                        <option value="distinction">Distinction</option>
                        <option value="not-applicable">Not applicable</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="graduation-year">
                        Year of graduation
                    </label>

                    <select
                        id="graduation-year"
                        name="graduation-year"
                        required
                    >

                        <option value="" disabled selected>
                            Select year
                        </option>

                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="earlier">Before 2020</option>

                    </select>

                </div>

            </div>


            <!-- Navigation -->

            <div class="onboarding-buttons">

                <a
                    href="graduate-onboarding.html"
                    class="back-button"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>


                <a
                    href="graduate-opportunities.html"
                    class="continue-button"
                >

                    Continue

                    <i class="fa-solid fa-arrow-right"></i>

                </a>

            </div>


        </form>


    </div>

</main>

</body>

</html>
