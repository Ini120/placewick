<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset password | Placewick</title>

    <meta
        name="description"
        content="Choose a new password for your Placewick account."
    >

    <!-- Google Font: Manrope -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="company-account.css"
    >

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-v2/favicon-32x32-v2.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-v2/favicon-16x16-v2.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-v2/apple-touch-icon-v2.png?v=2">
    <link rel="icon" type="image/x-icon" href="favicon-v2/favicon-v2.ico?v=2">
    <link rel="stylesheet" href="auth.css">
</head>


<body>


<main class="signup-page">


    <div class="signup-container">


        <!-- Logo -->

        <section class="signup-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>



        <section class="signup-header">
            <h1>Choose a new password</h1>
            <p>Enter a new password for your account.</p>
        </section>

        <form class="signup-form" id="reset-form" novalidate>
            <div class="form-message" role="alert"></div>
            <div class="form-group">
                <label for="password">New password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Create a new password" required>
                    <button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm new password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your new password" required>
                    <button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>
            <a href="#" class="create-button" id="reset-btn">Save new password <i class="fa-solid fa-arrow-right"></i></a>
        </form>
        <p class="login-text"><a href="login.html">Back to log in</a></p>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
    document.querySelectorAll('.password-toggle').forEach(function (toggle) {
        toggle.addEventListener('click', function () {
            var input = toggle.previousElementSibling, icon = toggle.querySelector('i');
            if (!input) return;
            var hidden = input.type === 'password';
            input.type = hidden ? 'text' : 'password';
            toggle.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
            if (icon) { icon.classList.toggle('fa-eye', !hidden); icon.classList.toggle('fa-eye-slash', hidden); }
        });
    });
</script>
<script>
(function () {
    var A = window.placewickAuth, form = document.getElementById('reset-form'), btn = document.getElementById('reset-btn');
    form.querySelector('.form-message').style.display = 'none';
    if (!A || !A.client) { return; }
    var sb = A.client, ok = false;
    sb.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') { ok = true; } });
    setTimeout(function () { if (!ok) { A.note(form, 'This reset link has expired or is not valid. Go back to log in and request a new one.'); } }, 2500);
    btn.addEventListener('click', function (e) {
        e.preventDefault();
        var p = document.getElementById('password').value, c = document.getElementById('confirm-password').value;
        if (p.length < 8) { A.note(form, 'Your password must be at least 8 characters.'); return; }
        if (p !== c) { A.note(form, 'The two passwords do not match.'); return; }
        A.setBusy(btn, true, 'Saving...');
        sb.auth.updateUser({ password: p }).then(function (r) {
            A.setBusy(btn, false);
            if (r.error) { A.note(form, A.friendly(r.error)); return; }
            A.note(form, 'Password updated. Taking you to log in...', 'success');
            sb.auth.signOut().then(function () { setTimeout(function () { location.href = 'login.html'; }, 1500); });
        });
    });
})();
</script>

</body>

</html>
