<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile Complete | Placewick</title>

    <meta
        name="description"
        content="Your Placewick profile is complete."
    >

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="applicant-onboarding.css"
    >

</head>


<body>


<main class="applicant-onboarding">

    <div class="applicant-onboarding-container">


        <!-- Logo -->

        <section class="applicant-onboarding-top">

            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>


        <!-- Final Progress -->

        <section class="onboarding-flow">

            <div class="circle active"></div>

            <div class="line"></div>

            <div class="circle active"></div>

            <div class="line"></div>

            <div class="circle active"></div>

            <div class="line"></div>

            <div class="circle active"></div>

            <div class="line"></div>

            <div class="circle active"></div>

            <div class="line"></div>

            <div class="circle active"></div>

            <div class="line"></div>

            <div class="circle active"></div>

        </section>


        <!-- Completion -->

        <section class="completion-content">


            <div class="completion-icon">

                <i class="fa-solid fa-check"></i>

            </div>


            <h1>
                You're all set!
            </h1>


            <p>
                Your Placewick profile is complete.
                Now you're ready to discover opportunities
                that match your skills, interests, and goals.
            </p>


            <div class="completion-actions">

                <a
                    href="dashboard.html"
                    class="continue-button"
                >

                    Find opportunities

                    <i class="fa-solid fa-arrow-right"></i>

                </a>


                <a
                    href="dashboard.html"
                    class="dashboard-link"
                >

                    Go to dashboard

                </a>

            </div>


        </section>


    </div>

</main>


</body>

</html>
