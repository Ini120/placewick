<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log in | Placewick</title>

    <meta
        name="description"
        content="Log in to your Placewick account."
    >

    <!-- Google Font: Manrope -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="company-account.css"
    >

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-v2/favicon-32x32-v2.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-v2/favicon-16x16-v2.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-v2/apple-touch-icon-v2.png?v=2">
    <link rel="icon" type="image/x-icon" href="favicon-v2/favicon-v2.ico?v=2">
    <link rel="stylesheet" href="auth.css">
</head>


<body>


<main class="signup-page">


    <div class="signup-container">


        <!-- Logo -->

        <section class="signup-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>



        <section class="signup-header">
            <h1>Welcome back</h1>
            <p>Log in to find opportunities, manage placements and track progress.</p>
        </section>

        <form class="signup-form" id="login-form" novalidate>
            <div class="form-message" role="alert"></div>
            <div class="form-group">
                <label for="email">Email address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>
            <div class="forgot-row"><a href="#" id="forgot">Forgot password?</a></div>
            <a href="#" class="create-button" id="login-btn">Log in <i class="fa-solid fa-arrow-right"></i></a>
            <div class="divider"><span></span><p>OR</p><span></span></div>
            <button type="button" class="google-button" data-google><span class="google-icon">G</span> Continue with Google</button>
        </form>
        <p class="login-text">New to Placewick? <a href="sign-up.html">Create an account</a></p>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
    document.querySelectorAll('.password-toggle').forEach(function (toggle) {
        toggle.addEventListener('click', function () {
            var input = toggle.previousElementSibling, icon = toggle.querySelector('i');
            if (!input) return;
            var hidden = input.type === 'password';
            input.type = hidden ? 'text' : 'password';
            toggle.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
            if (icon) { icon.classList.toggle('fa-eye', !hidden); icon.classList.toggle('fa-eye-slash', hidden); }
        });
    });
</script>
<script>
(function () {
    var A = window.placewickAuth, form = document.getElementById('login-form');
    var email = document.getElementById('email'), pass = document.getElementById('password'), btn = document.getElementById('login-btn');
    form.querySelector('.form-message').style.display = 'none';
    if (!A || !A.client) { return; }
    var sb = A.client;

    var qs = new URLSearchParams(location.search);
    if (qs.get('registered')) { A.note(form, 'Account created. We have sent a confirmation link to your email. Click it, then log in here.', 'success'); }
    else if (qs.get('confirmed')) { A.note(form, 'Email confirmed. You can log in now.', 'success'); }
    sb.auth.getSession().then(function (r) { if (r.data && r.data.session) { A.route(); } });
    sb.auth.onAuthStateChange(function (ev, session) { if (ev === 'SIGNED_IN' && session) { A.route(); } });

    function login(e) {
        if (e) { e.preventDefault(); }
        if (!email.value.trim() || !pass.value) { A.note(form, 'Enter your email and password.'); return; }
        A.note(form, '', 'info'); A.setBusy(btn, true, 'Logging in...');
        sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value }).then(function (res) {
            if (res.error) {
                A.setBusy(btn, false);
                var el = A.note(form, A.friendly(res.error));
                if (/not confirmed/i.test(res.error.message || '')) {
                    el.appendChild(document.createTextNode(' '));
                    var a = document.createElement('a'); a.textContent = 'Resend confirmation email';
                    a.addEventListener('click', function () {
                        sb.auth.resend({ type: 'signup', email: email.value.trim() }).then(function () { A.note(form, 'Confirmation email sent. Check your inbox.', 'success'); });
                    });
                    el.appendChild(a);
                }
                return;
            }
            A.route();
        }).catch(function (err) { A.setBusy(btn, false); A.note(form, A.friendly(err)); });
    }
    btn.addEventListener('click', login);
    [email, pass].forEach(function (i) { i.addEventListener('keydown', function (e) { if (e.key === 'Enter') { login(e); } }); });

    document.getElementById('forgot').addEventListener('click', function (e) {
        e.preventDefault();
        if (!email.value.trim()) { A.note(form, 'Type your email address above first, then click "Forgot password?".'); return; }
        sb.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: location.origin + '/reset-password.html' }).then(function (r) {
            A.note(form, r.error ? A.friendly(r.error) : 'If an account exists for that email, we have sent a link to reset your password.', r.error ? 'error' : 'success');
        });
    });
})();
</script>

</body>

</html>
