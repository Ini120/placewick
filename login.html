<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Placewick</title>

    <meta
        name="description"
        content="Log in to your Placewick account and continue your journey."
    >

    <!-- Google Font: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

</head>


<body>

    <main class="login-page">

        <div class="login-container">

            <!-- Logo -->
            <section class="login-top">

                <a href="index.html" class="logo">

                    <img
                        src="images/placewick-LOGO.png"
                        alt="Placewick"
                    >

                </a>

            </section>


            <!-- Header -->
            <section class="login-header">

                <h1>Welcome Back</h1>

                <p>
                    Log in to your Placewick account to continue.
                </p>

            </section>


            <!-- Login Form -->
            <section class="login-form">

                <form action="#">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group password-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Forgot Password -->
                    <div class="forgot-container">

                        <a
                            class="forgot-password"
                            href="forgot-password.html"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-button"
                    >
                        Log in
                    </button>


                    <!-- Divider -->
                    <div class="divider">

                        <span>or</span>

                    </div>


                    <!-- Google Login -->
                    <button
                        type="button"
                        class="google-button"
                    >

                        <svg
                            class="google-logo"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                fill="#4285F4"
                                d="M21.35 12.27c0-.71-.06-1.39-.18-2.04H12v3.86h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.21z"
                            />

                            <path
                                fill="#34A853"
                                d="M12 21.8c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.53A9.74 9.74 0 0 0 12 21.8z"
                            />

                            <path
                                fill="#FBBC05"
                                d="M6.54 13.88A5.86 5.86 0 0 1 6.23 12c0-.65.11-1.28.31-1.88V7.59H3.29A9.8 9.8 0 0 0 2.25 12c0 1.58.38 3.08 1.04 4.41l3.25-2.53z"
                            />

                            <path
                                fill="#EA4335"
                                d="M12 6.09c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.13 14.63 2.2 12 2.2a9.74 9.74 0 0 0-8.71 5.39l3.25 2.53C7.31 7.81 9.46 6.09 12 6.09z"
                            />

                        </svg>

                        <span>Continue with Google</span>

                    </button>

                </form>

            </section>


            <!-- Sign Up -->
            <p class="signup-text">

                Don't have an account?

                <a href="sign-up.html">
                    Sign up
                </a>

            </p>


        </div>

    </main>

</body>

</html>
