<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>You're All Set | Placewick</title>

    <meta
        name="description"
        content="Your Placewick company profile is ready. Start posting opportunities."
    >


    <!-- Google Font: Manrope -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="company-onboarding.css"
    >

</head>


<body>


<main class="company-onboarding">


    <div class="company-onboarding-container">


        <!-- Logo -->

        <section class="company-onboarding-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>


        <!-- Completion -->

        <section class="completion-content">

            <div class="completion-icon">
                <i class="fa-solid fa-check"></i>
            </div>

            <h1>Your company profile is ready!</h1>

            <p>
                You can now post opportunities and start
                reviewing applicants. If you submitted your
                CAC/RC details, our team will review them and
                notify you once your company is verified.
            </p>

            <div class="completion-status">
                <i class="fa-solid fa-clock"></i>
                Verification in review
            </div>

            <div class="completion-actions">

                <a href="post-opportunity.html" class="continue-button">
                    Post your first opportunity
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

                <a href="company-account.html" class="dashboard-link">
                    Go to dashboard
                </a>

            </div>

        </section>


    </div>


</main>


</body>

</html>
