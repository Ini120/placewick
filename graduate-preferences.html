<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Preferences | Placewick</title>

    <meta
        name="description"
        content="Tell Placewick your work preferences."
    >

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="applicant-onboarding.css"
    >

</head>


<body>

<main class="applicant-onboarding">

    <div class="applicant-onboarding-container">


        <!-- Stage -->

        <div class="onboarding-stage">
            Stage 6 of 7
        </div>


        <!-- Logo -->

        <section class="applicant-onboarding-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>


        <!-- Progress -->

       <section class="onboarding-flow">

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Journey</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>About You</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Education</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Opportunities</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Skills</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Preferences</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>All Set</span>
    </div>

</section>

        <!-- Header -->

        <section class="onboarding-header">

            <h1>Your work preferences</h1>

            <p>
                Tell us how and where you'd like to work so we
                can surface the most relevant opportunities.
            </p>

        </section>


        <!-- Form -->

        <form class="preferences-form">


            <!-- Preferred State -->

            <div class="form-group state-group">

                <label for="preferred-state">
                    Preferred state
                </label>

                <select
                    id="preferred-state"
                    name="preferred-state"
                    required
                >

                    <option value="" disabled selected>
                        Select a state
                    </option>

                    <option value="lagos">Lagos</option>
                    <option value="abuja">FCT, Abuja</option>
                    <option value="rivers">Rivers</option>
                    <option value="oyo">Oyo</option>
                    <option value="kano">Kano</option>
                    <option value="ogun">Ogun</option>
                    <option value="enugu">Enugu</option>
                    <option value="delta">Delta</option>
                    <option value="kaduna">Kaduna</option>
                    <option value="anywhere">No preference</option>

                </select>

            </div>


            <!-- Work Arrangement -->

            <div class="form-group work-type-group">

                <label for="work-type">
                    Preferred work arrangement
                </label>

                <select
                    id="work-type"
                    name="work-type"
                    required
                >

                    <option value="" disabled selected>
                        Select an arrangement
                    </option>

                    <option value="onsite">On-site</option>
                    <option value="hybrid">Hybrid</option>
                    <option value="remote">Remote</option>
                    <option value="no-preference">No preference</option>

                </select>

            </div>


            <!-- Relocation -->

            <div class="form-group relocation-group">

                <label for="relocation">
                    Willing to relocate?
                </label>

                <select
                    id="relocation"
                    name="relocation"
                    required
                >

                    <option value="" disabled selected>
                        Select an option
                    </option>

                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                    <option value="depends">Depends on the role</option>

                </select>

            </div>


            <!-- Navigation -->

            <div class="onboarding-buttons">

                <a
                    href="graduate-skills.html"
                    class="back-button"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>


                <a
                    href="graduate-profile-complete.html"
                    class="continue-button"
                >

                    Continue

                    <i class="fa-solid fa-arrow-right"></i>

                </a>

            </div>


        </form>


    </div>

</main>

</body>

</html>
