<body>

                <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open menu">

                </button>

                    <h1>My Applications</h1>
<p>Track every application in one place.</p>
                </div>

            <div class="dashboard-header-right">

                

                

                <a href="profile.html" class="header-avatar"></a>

        <main class="dashboard-content">
<div class="page-error" id="page-error" hidden></div>

<div class="status-tabs" id="status-tabs">
  <button type="button" class="status-tab is-active" data-status="all">All <span id="c-all">0</span></button>
  <button type="button" class="status-tab" data-status="applied">Applied <span id="c-applied">0</span></button>
  <button type="button" class="status-tab" data-status="reviewing">Reviewing <span id="c-reviewing">0</span></button>
  <button type="button" class="status-tab" data-status="interview">Interview <span id="c-interview">0</span></button>
  <button type="button" class="status-tab" data-status="accepted">Accepted <span id="c-accepted">0</span></button>
  <button type="button" class="status-tab" data-status="rejected">Not Selected <span id="c-rejected">0</span></button>
  <button type="button" class="status-tab" data-status="withdrawn">Withdrawn <span id="c-withdrawn">0</span></button>
</div>
<div class="panel applications-panel">
  <div class="panel-body" id="applications-list"></div>
  <div class="panel-empty" id="applications-empty" hidden><i class="fa-regular fa-file-lines"></i><p id="applications-empty-text"></p><a href="browse-opportunities.html" class="btn btn-primary btn-sm">Browse opportunities</a></div>
</div>
</main>

    </div>

</div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="applicant-dashboard.js"></script>
<script src="student.js"></script>
<script>

(function () {
  var S = window.placewickStudent, sb = S.sb, esc = S.esc, apps = [], tab = "all";
  function render() {
    ["all", "applied", "reviewing", "interview", "accepted", "rejected", "withdrawn"].forEach(function (k) {
      document.getElementById("c-" + k).textContent = k === "all" ? apps.length : apps.filter(function (a) { return a.status === k; }).length;
    });
    var list = apps.filter(function (a) { return tab === "all" || a.status === tab; });
    document.getElementById("applications-list").innerHTML = list.map(function (a) {
      var can = ["applied", "reviewing", "interview"].indexOf(a.status) !== -1;
      return '<div class="application-row"><div class="application-logo">' + esc(S.initials(a.company_name)) + '</div><div class="application-details"><h4>' + esc(a.title) + '</h4><span>' +
        esc(a.company_name) + (a.location ? " &middot; " + esc(a.location) : "") + " &middot; Applied " + S.ago(a.created_at) + "</span></div>" + S.badge(a.status) +
        (can ? '<button type="button" class="app-row-action" data-withdraw="' + a.id + '">Withdraw</button>' : "") + "</div>";
    }).join("");
    var em = document.getElementById("applications-empty");
    em.hidden = list.length > 0;
    document.getElementById("applications-empty-text").textContent = apps.length ? "No applications in this category yet." : "You have not applied to anything yet.";
  }
  S.init().then(function () { S.badges(); return S.loadApps(); }).then(function (a) { apps = a; render(); }).catch(function () { S.fail(); });
  document.getElementById("status-tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".status-tab"); if (!b) { return; }
    tab = b.dataset.status;
    document.querySelectorAll("#status-tabs .status-tab").forEach(function (x) { x.classList.toggle("is-active", x === b); });
    render();
  });
  document.getElementById("applications-list").addEventListener("click", function (e) {
    var b = e.target.closest("[data-withdraw]"); if (!b) { return; }
    if (!window.confirm("Withdraw this application? The company will no longer see it as active.")) { return; }
    b.disabled = true;
    sb.from("applications").update({ status: "withdrawn" }).eq("id", b.dataset.withdraw).then(function (r) {
      if (r.error) { b.disabled = false; S.toast("Could not withdraw this application."); return; }
      apps.forEach(function (a) { if (a.id === b.dataset.withdraw) { a.status = "withdrawn"; } });
      render(); S.badges(); S.toast("Application withdrawn");
    });
  });
})();
</script>
</body>

</html>
