<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Opportunities You Want | Placewick</title>

    <meta
        name="description"
        content="Tell Placewick what kind of opportunities you're looking for."
    >

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="applicant-onboarding.css"
    >

</head>


<body>

<main class="applicant-onboarding">

    <div class="applicant-onboarding-container">


        <!-- Stage -->

        <div class="onboarding-stage">
            Stage 4 of 7
        </div>


        <!-- Logo -->

        <section class="applicant-onboarding-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>


        <!-- Progress -->

       <section class="onboarding-flow">

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Journey</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>About You</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Education</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Opportunities</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>Skills</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>Preferences</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>All Set</span>
    </div>

</section>

        <!-- Header -->

        <section class="applicant-onboarding-header">

            <h1>What are you looking for?</h1>

            <p>
                Select all the opportunity types you'd like to see.
                You can change this later in your preferences.
            </p>

        </section>


        <!-- Opportunity Cards -->

        <section class="undergrad-cards" id="opportunity-cards">

            <button type="button" class="opportunity-card" data-value="graduate-trainee">
                <span class="check"><i class="fa-solid fa-check"></i></span>
                <div class="icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <p>Graduate Trainee Programmes</p>
            </button>

            <button type="button" class="opportunity-card" data-value="full-time">
                <span class="check"><i class="fa-solid fa-check"></i></span>
                <div class="icon">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
                <p>Full-Time Roles</p>
            </button>

            <button type="button" class="opportunity-card" data-value="management-trainee">
                <span class="check"><i class="fa-solid fa-check"></i></span>
                <div class="icon">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <p>Management Trainee</p>
            </button>

            <button type="button" class="opportunity-card" data-value="contract">
                <span class="check"><i class="fa-solid fa-check"></i></span>
                <div class="icon">
                    <i class="fa-solid fa-file-signature"></i>
                </div>
                <p>Contract Roles</p>
            </button>

            <button type="button" class="opportunity-card" data-value="remote">
                <span class="check"><i class="fa-solid fa-check"></i></span>
                <div class="icon">
                    <i class="fa-solid fa-house-laptop"></i>
                </div>
                <p>Remote Roles</p>
            </button>

            <button type="button" class="opportunity-card" data-value="research">
                <span class="check"><i class="fa-solid fa-check"></i></span>
                <div class="icon">
                    <i class="fa-solid fa-microscope"></i>
                </div>
                <p>Research / Postgraduate</p>
            </button>

        </section>


        <!-- Navigation -->

        <div class="onboarding-buttons">

            <a
                href="graduate-education.html"
                class="back-button"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </a>


            <a
                href="graduate-skills.html"
                class="continue-button"
            >

                Continue

                <i class="fa-solid fa-arrow-right"></i>

            </a>

        </div>


    </div>

</main>


<script src="graduate-onboarding.js"></script>

</body>

</html>
