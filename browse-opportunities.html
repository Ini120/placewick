<div class="page-error" id="page-error" hidden></div>

<div class="browse-filters">
  <div class="browse-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="browse-search-input" placeholder="Search role, company or skill"></div>
  <select id="filter-category" class="browse-select"><option value="all">All types</option><option value="siwes">SIWES</option><option value="internship">Internship</option></select>
  <select id="filter-sort" class="browse-select"><option value="match">Best match</option><option value="newest">Newest</option><option value="az">Company A&ndash;Z</option></select>
  <div class="browse-chip-group" id="filter-worktype">
    <button type="button" class="browse-chip is-active" data-worktype="all">All</button>
    <button type="button" class="browse-chip" data-worktype="remote">Remote</button>
    <button type="button" class="browse-chip" data-worktype="on-site">On-site</button>
    <button type="button" class="browse-chip" data-worktype="hybrid">Hybrid</button>
  </div>
  <label class="browse-checkbox"><input type="checkbox" id="filter-paid"> Paid only</label>
</div>
<p class="browse-result-count" id="browse-result-count">Loading opportunities...</p>
<div class="browse-grid" id="browse-grid"></div>
</main>

    </div>

</div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="applicant-dashboard.js"></script>
<script src="student.js"></script>
<script>

(function () {
  var S = window.placewickStudent, sb = S.sb;
  function empty(icon, h, p, a) { return '<div class="empty-state"><i class="fa-regular ' + icon + '"></i><h4>' + h + '</h4><p>' + p + '</p>' + (a || '') + '</div>'; }
  var opps = [], saved = [], applied = {}, f = { q: "", type: "all", sort: "match", mode: "all", paid: false };
  var grid = document.getElementById("browse-grid"), count = document.getElementById("browse-result-count");
  function render() {
    var list = opps.filter(function (o) {
      var hay = [o.title, o.company_name, o.location, (o.skills || []).join(" ")].join(" ").toLowerCase();
      return (f.type === "all" || o.type === f.type) && (f.mode === "all" || o.work_mode === f.mode) && (!f.paid || S.paid(o)) && (!f.q || hay.indexOf(f.q) !== -1);
    });
    list.sort(function (a, b) {
      if (f.sort === "az") { return a.company_name.localeCompare(b.company_name); }
      if (f.sort === "match") { var d = (S.match(b) || 0) - (S.match(a) || 0); if (d) { return d; } }
      return new Date(b.created_at) - new Date(a.created_at);
    });
    grid.innerHTML = list.length ? list.map(function (o) { return S.card(o, saved.indexOf(o.id) !== -1, !!applied[o.id]); }).join("")
      : empty("fa-folder-open", opps.length ? "No opportunities match your search" : "No opportunities yet", opps.length ? "Try a different keyword or clear a filter." : "Verified companies are joining Placewick. Check back soon.");
    count.textContent = list.length + " opportunit" + (list.length === 1 ? "y" : "ies");
  }
  S.init().then(function () {
    S.badges();
    return Promise.all([S.loadOpps(), S.loadSavedIds(), S.loadApps()]);
  }).then(function (r) {
    opps = r[0]; saved = r[1]; r[2].forEach(function (a) { applied[a.opportunity_id] = a.status; });
    render();
    var open = new URLSearchParams(location.search).get("open");
    if (open) { var o = opps.filter(function (x) { return x.id === open; })[0]; if (o) { S.openModal(o, !!applied[o.id], markApplied); } }
  }).catch(function () { S.fail(); });
  function markApplied(id) { applied[id] = "applied"; render(); S.badges(); }
  document.getElementById("browse-search-input").addEventListener("input", function (e) { f.q = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById("filter-category").addEventListener("change", function (e) { f.type = e.target.value; render(); });
  document.getElementById("filter-sort").addEventListener("change", function (e) { f.sort = e.target.value; render(); });
  document.getElementById("filter-paid").addEventListener("change", function (e) { f.paid = e.target.checked; render(); });
  document.getElementById("filter-worktype").addEventListener("click", function (e) {
    var b = e.target.closest(".browse-chip"); if (!b) { return; }
    f.mode = b.dataset.worktype;
    document.querySelectorAll("#filter-worktype .browse-chip").forEach(function (x) { x.classList.toggle("is-active", x === b); });
    render();
  });
  grid.addEventListener("click", function (e) {
    var op = e.target.closest("[data-open]");
    if (op) { e.preventDefault(); var o = opps.filter(function (x) { return x.id === op.dataset.open; })[0]; if (o) { S.openModal(o, !!applied[o.id], markApplied); } return; }
    var sv = e.target.closest("[data-save]");
    if (sv) {
      var id = sv.dataset.save, make = saved.indexOf(id) === -1;
      S.toggleSave(id, make).then(function (r) {
        if (r.error) { S.toast("Could not update your saved list."); return; }
        if (make) { saved.push(id); } else { saved = saved.filter(function (x) { return x !== id; }); }
        render(); S.toast(make ? "Saved" : "Removed from saved");
      });
    }
  });
})();
</script>
</body>
