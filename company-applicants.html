<div class="page-toolbar">

</div>
<div class="panel">
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Applicant</th><th>Opportunity</th><th>Applied</th><th>Status</th><th>Update</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>

    </div>


</div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="applicant-dashboard.js"></script>
<script src="dash.js"></script>
<script>

(function () {
  var D = window.placewickDash, esc = D.esc, sb = D.sb, data, status = "all", q = "";
  var OPTIONS = [["applied", "New"], ["reviewing", "Reviewing"], ["interview", "Interview"], ["accepted", "Accepted"], ["rejected", "Not selected"]];
  function render() {
    var list = data.apps.filter(function (a) {
      var hay = (D.studentName(data, a.student_id) + " " + D.studentSchool(data, a.student_id) + " " + D.oppTitle(data, a.opportunity_id)).toLowerCase();
      return (status === "all" || a.status === status) && (!q || hay.indexOf(q) !== -1);
    });
    document.getElementById("rows").innerHTML = list.map(function (a) {
      var n = D.studentName(data, a.student_id), s = data.students[a.student_id] || {};
      var sub = [s.course, D.studentSchool(data, a.student_id)].filter(Boolean).join(" \u00b7 ");
      var ctl = a.status === "withdrawn" ? '<span class="cell-muted">Withdrawn by student</span>' :
        '<select class="status-select" data-id="' + a.id + '">' + OPTIONS.map(function (o) {
          return '<option value="' + o[0] + '"' + (o[0] === a.status ? " selected" : "") + '>' + o[1] + '</option>';
        }).join("") + '</select>';
      return '<tr><td><div class="person-cell"><div class="avatar-sm">' + esc(D.initials(n)) + '</div><div><h4>' + esc(n) + '</h4><span>' + esc(sub) + '</span></div></div></td>' +
        '<td>' + esc(D.oppTitle(data, a.opportunity_id)) + '</td><td class="cell-muted">' + D.ago(a.created_at) + '</td><td>' + D.badge(a.status) + '</td><td>' + ctl + '</td></tr>';
    }).join("");
    var empty = document.getElementById("empty");
    empty.textContent = data.apps.length ? "No applicants match your search." : "No applicants yet. They will appear here when students apply to your opportunities.";
    empty.classList.toggle("is-visible", !list.length);
    document.getElementById("count").textContent = "Showing " + list.length + " applicant" + (list.length === 1 ? "" : "s");
  }
  function reload() { return D.loadAll().then(function (d) { data = d; render(); }); }
  D.init().then(reload).catch(function () { D.fail(); });
  document.getElementById("search").addEventListener("input", function (e) { q = e.target.value.trim().toLowerCase(); if (data) { render(); } });
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) { return; }
    status = b.dataset.filter;
    document.querySelectorAll("#filters .chip").forEach(function (x) { x.classList.toggle("is-active", x === b); });
    if (data) { render(); }
  });
  function startPlacement(app) {
    var s = data.students[app.student_id] || {};
    return sb.from("placements").insert({
      application_id: app.id, student_id: app.student_id, company_id: D.company.id, institution_id: s.institution_id || null
    }).then(function (r) {
      if (r.error && r.error.code !== "23505") { D.toast("Accepted, but the placement could not be created."); }
    });
  }
  document.getElementById("rows").addEventListener("change", function (e) {
    var sel = e.target.closest(".status-select"); if (!sel) { return; }
    var app = data.apps.filter(function (a) { return a.id === sel.dataset.id; })[0];
    var to = sel.value;
    if (to === "accepted" && !window.confirm("Accept this applicant? This starts their placement with your company.")) { sel.value = app.status; return; }
    sel.disabled = true;
    sb.from("applications").update({ status: to }).eq("id", app.id).then(function (r) {
      if (r.error) { sel.disabled = false; sel.value = app.status; D.toast("Could not update this applicant."); return; }
      app.status = to;
      var next = to === "accepted" ? startPlacement(app) : Promise.resolve();
      next.then(function () { D.toast("Status updated"); return reload(); });
    });
  });
})();
</script>
