<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account Created | Placewick</title>

    <meta
        name="description"
        content="Your Placewick account has been created successfully."
    >


    <!-- Google Font: Manrope -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="account-completed.css"
    >

</head>


<body>


<main class="account-created-page">


    <div class="account-created-container">


        <!-- Logo -->

        <section class="account-created-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>



        <!-- Success Icon -->

        <div class="success-icon">

            <i class="fa-solid fa-check"></i>

        </div>



        <!-- Content -->

        <section class="account-created-content">

            <h1>
                Account created!
            </h1>

            <p class="main-text">

                Your Placewick account has been
                created successfully.

            </p>


            <div class="onboarding-message">

                <h2>
                    Let's set up your profile
                </h2>

                <p>

                    Tell us a little about yourself,
                    your education, skills, and the
                    opportunities you're looking for.

                </p>

            </div>


            <!-- Button -->

            <a
                href="applicant-onboarding.html"
                class="continue-button"
            >

                Continue with onboarding

                <i class="fa-solid fa-arrow-right"></i>

            </a>


            <p class="time-message">

                This will only take a few minutes.

            </p>

        </section>


    </div>

</main>


</body>

</html>
