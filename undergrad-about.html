<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>About You | Placewick</title>

    <meta
        name="description"
        content="Tell Placewick a little about yourself."
    >

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="applicant-onboarding.css"
    >

</head>


<body>

<main class="applicant-onboarding">

    <div class="applicant-onboarding-container">


        <!-- Logo -->

        <section class="applicant-onboarding-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>


        <!-- Progress -->

       <section class="onboarding-flow">

    <div class="progress-step active">
        <div class="circle"></div>
        <span>Journey</span>
    </div>

    <div class="line"></div>

    <div class="progress-step active">
        <div class="circle"></div>
        <span>About You</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>Education</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>Opportunities</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>Skills</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>Preferences</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle"></div>
        <span>All Set</span>
    </div>

</section>

        <!-- Header -->

        <section class="onboarding-header">

            <h1>Let's get to know you</h1>

            <p>
                Tell us a little about yourself to personalize
                your Placewick experience.
            </p>

        </section>


        <!-- Form -->

        <form class="onboarding-form">


            <!-- First Name -->

            <div class="form-group">

                <label for="first-name">
                    First name
                </label>

                <input
                    type="text"
                    id="first-name"
                    name="first-name"
                    placeholder="Enter your first name"
                    required
                >

            </div>


            <!-- Last Name -->

            <div class="form-group">

                <label for="last-name">
                    Last name
                </label>

                <input
                    type="text"
                    id="last-name"
                    name="last-name"
                    placeholder="Enter your last name"
                    required
                >

            </div>


            <!-- Age -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <select
                    id="age"
                    name="age"
                    required
                >

                    <option
                        value=""
                        disabled
                        selected
                    >
                        Select your age
                    </option>

                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                    <option value="19">19</option>
                    <option value="20">20</option>
                    <option value="21">21</option>
                    <option value="22">22</option>
                    <option value="23">23</option>
                    <option value="24">24</option>
                    <option value="25">25</option>
                    <option value="26">26</option>
                    <option value="27">27</option>
                    <option value="28">28</option>
                    <option value="29">29</option>
                    <option value="30">30</option>

                </select>

            </div>


            <!-- Navigation -->

            <div class="onboarding-buttons">

                <a
                    href="applicant-onboarding.html"
                    class="back-button"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>


                <a
                    href="undergraduate-education.html"
                    class="continue-button"
                >

                    Continue

                    <i class="fa-solid fa-arrow-right"></i>

                </a>

            </div>


        </form>


    </div>

</main>

</body>

</html>
