<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>You're All Set | Placewick</title>

    <meta
        name="description"
        content="Your Placewick profile is ready. Start exploring opportunities."
    >

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="applicant-onboarding.css"
    >

</head>


<body>

<main class="applicant-onboarding">

    <div class="applicant-onboarding-container">


        <!-- Stage -->

        <div class="onboarding-stage">
            Stage 7 of 7
        </div>


        <!-- Logo -->

        <section class="applicant-onboarding-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>


        <!-- Progress -->

       <section class="onboarding-flow">

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Journey</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>About You</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Education</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Opportunities</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Skills</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>Preferences</span>
    </div>

    <div class="line active"></div>

    <div class="progress-step active">
        <div class="circle active"></div>
        <span>All Set</span>
    </div>

</section>


        <!-- Completion -->

        <section class="completion-content">

            <div class="completion-icon">
                <i class="fa-solid fa-check"></i>
            </div>

            <h1>You're all set!</h1>

            <p>
                Your profile is ready. Start browsing graduate
                roles, early-career opportunities and internships
                matched to your background and interests.
            </p>

            <div class="completion-actions">

                <a href="browse-opportunities.html" class="continue-button">
                    Explore opportunities
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

                <a href="applicant-dashboard.html" class="dashboard-link">
                    Go to dashboard
                </a>

            </div>

        </section>


    </div>

</main>

</body>

</html>
