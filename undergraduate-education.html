<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Applicant Onboarding | Placewick</title>

    <meta
        name="description"
        content="Tell Placewick where you are in your academic and career journey."
    >


    <!-- Google Font: Manrope -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="applicant-onboarding.css"
    >

    <script src="undergraduate-education.js"></script>

</head>


<body>


<main class="applicant-onboarding">


    <div class="applicant-onboarding-container">


        <!-- Logo -->

        <section class="applicant-onboarding-top">

            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>



        <!-- Onboarding Progress -->

        <section class="onboarding-flow">

            <div class="circle active"></div>

            <div class="line"></div>

            <div class="circle active"></div>

            <div class="line"></div>

            <div class="circle"></div>

            <div class="line"></div>

            <div class="circle"></div>

            <div class="line"></div>

            <div class="circle"></div>


            </section>

            <!-- Header -->

        <section class="applicant-onboarding-header">

            <h1>
                Where are you studying?
            </h1>

            <p>
                Tell us about your academic journey.

        </section>

        <form>
            <div class="form-group">

    <label for="university">University</label>

    <select id="university" name="university">

        <option value="" disabled selected>
            Select your university
        </option>

        <option value="nile">
            Nile University of Nigeria
        </option>

        <option value="abuja">
            University of Abuja
        </option>

        <option value="baze">
            Baze University
        </option>

        <option value="unilag">
            University of Lagos
        </option>

        <option value="uniben">
            University of Benin
        </option>

        <option value="unilorin">
            University of Ilorin
        </option>

        <option value="unical">
            University of Calabar
        </option>

        <option value="unizik">
            Nnamdi Azikiwe University
        </option>

    </select>

</div>

<!--course-->

    <div class="form-group course-group">

    <label for="course">What are you studying?</label>

    <select id="course" name="course">

        <option value="" disabled selected>
            Select your course
        </option>

        <option value="software">
            Software Engineering
        </option>

        <option value="computer">
            Computer Science
        </option>

        <option value="accounting">
        Accounting
        </option>

        <option value="medicine">
            Medicine and Surgery (MBBS)
        </option>

        <option value="civil">
            Civil Engineering
        </option>

        <option value="cyber">
            Cyber Security
        </option>

        <option value="computer">
            Computer Engineering
        </option>

        <option value="nursing">
            Nursing
        </option>

    </select>

</div>


<section class="entry-graduation">
    <!--level-->

    <div class="form-group level-group">

    <label for="level">What level are you in?</label>

    <select id="level" name="level">

        <option value="" disabled selected>
            Select your level
        </option>


        <option value="A">
            A Level
        </option>

        <option value="100">
            100 Level
        </option>

        <option value="200">
            200 Level
        </option>

        <option value="300">
            300 Level
        </option>

        <option value="400">
            400 Level
        </option>

        <option value="500">
            500 Level
        </option>

        <option value="600">
            600 Level
        </option>

    </select>

</div>




 <!--graduation year-->

    <div class="form-group level-group">

    <label for="grad">Expected graduation</label>

    <select id="grad" name="grad">

        <option value="" disabled selected>
            Select expected grad year
        </option>


        <option value="2026">
            2026
        </option>

        <option value="2027">
            2027
        </option>

        <option value="2028">
            2028
        </option>

        <option value="2029">
            2029
        </option>

        <option value="2030">
            2030
        </option>

        <option value="2031">
            2031
        </option>

        <option value="2032">
            2032
        </option>

    </select>

</div>


</section>


<div class="onboarding-buttons">

    <a href="applicant-onboarding.html" class="back-button">
        <i class="fa-solid fa-arrow-left"></i>
        Back
    </a>

    <a href="undergraduate-opportunities.html" class="continue-button">
    Continue
    <i class="fa-solid fa-arrow-right"></i>
</a>

</div>

        </form>


    </body>
    </html>
