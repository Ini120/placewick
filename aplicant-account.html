<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Placewick</title>

    <meta
        name="description"
        content="Create your Placewick account and start discovering opportunities."
    >

    <!-- Google Font: Manrope -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="create-account.css"
    >

</head>


<body>


<main class="signup-page">


    <div class="signup-container">


        <!-- Logo -->

        <section class="signup-top">

            <a href="index.html" class="logo">

                <img
                    src="images/placewick-LOGO.png"
                    alt="Placewick"
                >

            </a>

        </section>



        <!-- Header -->

        <section class="signup-header">

            <h1>
                Create your Placewick account
            </h1>

            <p>
                Start discovering opportunities built around
                where you are and where you're headed.
            </p>

        </section>



        <!-- Form -->

        <form class="signup-form">


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <div class="input-wrapper">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>

            </div>



            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                    >

                        <i class="fa-regular fa-eye"></i>

                    </button>

                </div>

            </div>



            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm-password">
                    Confirm password
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                    >

                        <i class="fa-regular fa-eye"></i>

                    </button>

                </div>

            </div>



            <!-- Terms -->

            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#">Terms of Service</a>
                        and
                        <a href="#">Privacy Policy</a>
                    </span>

                </label>

            </div>



            <!-- Create Account -->

            <a
                href="account-completed.html"
                class="create-button"
            >

                Create account

                <i class="fa-solid fa-arrow-right"></i>

        </a>



            <!-- Divider -->

            <div class="divider">

                <span></span>

                <p>OR</p>

                <span></span>

            </div>



            <!-- Google -->

            <button
                type="button"
                class="google-button"
            >

                <span class="google-icon">G</span>

                Continue with Google

            </button>


        </form>



        <!-- Login -->

        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Log in
            </a>

        </p>


    </div>

</main>


</body>

</html>
